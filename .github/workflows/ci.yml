name: Quality gates

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  DATABASE_URL: file:./data/ci.db
  ADMIN_PASSWORD: ci-admin-password
  SESSION_SECRET: ci-session-secret-with-at-least-32-characters
  IP_HASH_SECRET: ci-ip-hash-secret-with-at-least-32-characters
  TURNSTILE_ENABLED: "false"
  TRUST_CLOUDFLARE_PROXY: "false"
  TRUST_PROXY: "false"
  EXTERNAL_SERVICES_MODE: live
  TZ: Asia/Shanghai

jobs:
  quality:
    name: Static checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test:unit
      - name: Integration tests
        run: pnpm test:integration
      - name: API tests
        run: pnpm test:api
      - name: Coverage gate
        run: pnpm test:coverage
      - name: Production build
        run: pnpm build

  e2e:
    name: Browser workflow
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run end-to-end workflow
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Production container
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Build and start production Compose stack
        env:
          ASKBOX_ENV_FILE: tests/fixtures/docker.env
          COMPOSE_PROJECT_NAME: askbox-ci
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build
      - name: Wait for health
        env:
          ASKBOX_ENV_FILE: tests/fixtures/docker.env
          COMPOSE_PROJECT_NAME: askbox-ci
        run: |
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:33101/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs
          exit 1
      - name: Verify migrations, permissions, and persistent volume
        run: |
          docker exec askbox-ci-askbox-1 sh -lc \
            'test "$(id -u)" = 1001 && ! touch /read-only-probe 2>/dev/null && touch /tmp/tmp-probe'
          docker exec askbox-ci-askbox-1 node -e \
            "const D=require('better-sqlite3');const d=new D('/data/askbox.db');const tables=d.prepare(\"select name from sqlite_master where type='table' and name in ('questions','answers','cards')\").all();if(tables.length!==3)process.exit(1);const now=Date.now();d.prepare(\"insert into questions(content,status,ip_hash,user_agent_hash,spam_score,is_blocked,telegram_notified,created_at,updated_at) values(?,'unread',?,?,0,0,0,?,?)\").run('docker-restart-probe','c'.repeat(64),'d'.repeat(64),now,now);d.close()"
      - name: Verify maintenance and restart recovery
        env:
          ASKBOX_ENV_FILE: tests/fixtures/docker.env
          COMPOSE_PROJECT_NAME: askbox-ci
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml run --rm maintenance
          docker compose -f docker-compose.yml -f docker-compose.ci.yml restart askbox
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:33101/api/health >/dev/null; then
              docker exec askbox-ci-askbox-1 node -e \
                "const D=require('better-sqlite3');const d=new D('/data/askbox.db',{readonly:true});const n=d.prepare('select count(*) as value from questions where content=?').get('docker-restart-probe').value;d.close();if(n!==1)process.exit(1)"
              exit $?
            fi
            sleep 2
          done
          exit 1
      - name: Show container logs
        if: ${{ failure() }}
        env:
          ASKBOX_ENV_FILE: tests/fixtures/docker.env
          COMPOSE_PROJECT_NAME: askbox-ci
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs
      - name: Remove isolated stack
        if: ${{ always() }}
        env:
          ASKBOX_ENV_FILE: tests/fixtures/docker.env
          COMPOSE_PROJECT_NAME: askbox-ci
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down --volumes
