name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"
  DATABASE_URL: file:./.tmp/ci.db
  ADMIN_PASSWORD: ci-admin-password-with-strong-length
  SESSION_SECRET: ci-session-secret-with-at-least-32-characters
  IP_HASH_SECRET: ci-ip-hash-secret-with-at-least-32-characters
  TELEGRAM_BOT_TOKEN: ci-not-used
  TELEGRAM_CHAT_ID: "1"
  ADMIN_PUBLIC_URL: https://ask.example.com/admin
  TURNSTILE_ENABLED: "false"
  TRUST_CLOUDFLARE_PROXY: "false"
  TRUST_PROXY: "true"
  EXTERNAL_SERVICES_MOCK: "false"

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:integration
      - run: pnpm test:coverage
      - run: pnpm build

  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            output/playwright/
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Docker production smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Create isolated CI environment
        run: |
          cat > .env <<'EOF'
          ADMIN_PASSWORD=ci-admin-password-with-strong-length
          SESSION_SECRET=ci-session-secret-with-at-least-32-characters
          IP_HASH_SECRET=ci-ip-hash-secret-with-at-least-32-characters
          TELEGRAM_BOT_TOKEN=ci-not-used
          TELEGRAM_CHAT_ID=1
          ADMIN_PUBLIC_URL=https://ask.example.com/admin
          TURNSTILE_ENABLED=false
          NEXT_PUBLIC_TURNSTILE_SITE_KEY=
          TURNSTILE_SECRET_KEY=
          TRUST_CLOUDFLARE_PROXY=false
          TRUST_PROXY=true
          EXTERNAL_SERVICES_MOCK=false
          LOGIN_ATTEMPT_RETENTION_DAYS=30
          TZ=Asia/Shanghai
          EOF
      - run: docker compose config --quiet
      - run: docker compose up -d --build
      - name: Wait for healthy container
        run: |
          for attempt in $(seq 1 30); do
            status="$(docker inspect --format='{{.State.Health.Status}}' personal-askbox)"
            if [ "$status" = "healthy" ]; then exit 0; fi
            sleep 2
          done
          docker compose logs askbox
          exit 1
      - name: Verify migration and SQLite volume persistence
        run: |
          docker compose exec -T askbox node -e '
            const Database = require("better-sqlite3");
            const db = new Database("/data/askbox.db");
            db.exec("create table if not exists docker_probe (value text not null)");
            db.prepare("delete from docker_probe").run();
            db.prepare("insert into docker_probe(value) values (?)").run("persists");
            db.close();
          '
          docker compose restart askbox
          healthy=false
          for attempt in $(seq 1 30); do
            status="$(docker inspect --format='{{.State.Health.Status}}' personal-askbox)"
            if [ "$status" = "healthy" ]; then healthy=true; break; fi
            sleep 2
          done
          if [ "$healthy" != "true" ]; then exit 1; fi
          docker compose exec -T askbox node -e '
            const Database = require("better-sqlite3");
            const db = new Database("/data/askbox.db", { readonly: true });
            const row = db.prepare("select value from docker_probe").get();
            if (row?.value !== "persists") process.exit(1);
            const tables = db.prepare(
              "select name from sqlite_master where type = ? and name in (?, ?)"
            ).all("table", "answers", "cards");
            if (tables.length !== 2) process.exit(1);
            db.close();
          '
      - name: Verify maintenance image command
        run: docker compose --profile tools run --rm maintenance
      - name: Verify graceful stop and recovery
        run: |
          docker compose stop -t 15 askbox
          docker compose start askbox
          for attempt in $(seq 1 30); do
            status="$(docker inspect --format='{{.State.Health.Status}}' personal-askbox)"
            if [ "$status" = "healthy" ]; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Container logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose down
