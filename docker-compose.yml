services:
  askbox:
    build:
      context: .
      args:
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    image: personal-askbox:latest
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    env_file:
      - ${ASKBOX_ENV_FILE:-.env}
    environment:
      DATABASE_URL: file:/data/askbox.db
      NODE_ENV: production
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "127.0.0.1:${ASKBOX_HOST_PORT:-3001}:3000"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /app/.next/cache:size=64m,uid=1001,gid=1001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  maintenance:
    image: personal-askbox:latest
    profiles:
      - maintenance
    init: true
    env_file:
      - ${ASKBOX_ENV_FILE:-.env}
    environment:
      DATABASE_URL: file:/data/askbox.db
      NODE_ENV: production
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: ["node", "scripts/maintenance.mjs"]
